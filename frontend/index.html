<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>ReflexArena | Reaction Time Game</title>

    <script type="module" src="js/app.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- ==========================
         Header
    =========================== -->
    <header class="header">
        <h1>ReflexArena</h1>
        <p>Test your reaction speed against the clock.</p>
    </header>

    <!-- ==========================
         Main Content
    =========================== -->
    <main class="container">

        <!-- Left Column -->
        <aside class="sidebar">

            <!-- Player Card -->
            <section class="card">
                <h2>Player</h2>

                <label for="player-name">Player Name</label>

                <input
                    type="text"
                    id="player-name"
                    placeholder="Enter your name"
                >

                <button id="start-game">
                    Start Game
                </button>

            </section>

            <!-- Score Card -->
            <section class="card">
                <h2>Game Status</h2>

                <p>
                    <strong>Score:</strong>
                    <span id="score">0</span>
                </p>

                <p>
                    <strong>Time Left:</strong>
                    <span id="timer">30</span>s
                </p>

            </section>

        </aside>

        <!-- Game Area -->
        <section class="game-section">

            <div class="card">

                <h2>Game Arena</h2>

                <div id="game-arena" class="game-arena">

                    <!-- Random targets will appear here -->

                </div>

            </div>

        </section>

    </main>

    <!-- ==========================
         Leaderboard
    =========================== -->

    <section class="leaderboard">

        <div class="card">

            <h2>Leaderboard</h2>

            <table>

                <thead>

                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Score</th>
                    </tr>

                </thead>

                <tbody id="leaderboard-body">

                    <tr>
                        <td colspan="3">
                            No scores available.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <!-- JavaScript -->

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
