<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>ReflexArena | Reaction Time Game</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- ==========================
         Header
    =========================== -->
    <header class="header">
        <h1>ReflexArena</h1>
        <p>Test your reaction speed against the clock.</p>
    </header>

    <!-- ==========================
         Main Content
    =========================== -->
    <main class="main-layout">

        <aside class="sidebar">

            <section class="card">
                <h2>Player</h2>

                <label for="player-name">
                    Player Name
                </label>

                <input
                    id="player-name"
                    type="text"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

                <button id="start-game">
                    Start Game
                </button>
            </section>

            <section class="card">
                <h2>Game Status</h2>

                <div class="status-row">
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>

                <div class="status-row">
                    <span>Time Left</span>
                    <strong>
                        <span id="timer">30</span>s
                    </strong>
                </div>
            </section>

        </aside>

        <section class="card game-card">

            <h2>Game Arena</h2>

            <div
                id="game-arena"
                class="game-arena"
            ></div>

        </section>

    </main>

    <section class="leaderboard-section">

        <div class="card">

            <h2>Leaderboard</h2>

            <table>

                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Score</th>
                    </tr>
                </thead>

                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="3" class="text-center">
                            No scores yet
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

    <!-- JavaScript -->

    <script type="module" src="js/app.js"></script>
</body>
</html>
